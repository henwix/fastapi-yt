x-base-backend:
  &base-backend
  build:
    context: ..
    dockerfile: Dockerfile
  image: fastapi-yt-backend-dev
  pull_policy: build
  volumes:
    - ..:/src/
    - backend_venv:/src/.venv
  env_file:
    - ../.env

services:
  backend:
    <<: *base-backend
    container_name: fastapi-yt-backend-dev
    ports:
      - "${FASTAPI_PORT}:8000"
    command: "uvicorn --factory app.presentation.api.main:create_app --host 0.0.0.0 --port 8000 --reload --use-colors"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  taskiq:
    <<: *base-backend
    container_name: fastapi-yt-taskiq-dev
    command: taskiq worker app.infrastructure.taskiq.setup:broker app.infrastructure.taskiq.tasks --reload --no-configure-logging
    depends_on:
      redis:
        condition: service_healthy

  taskiq-scheduler:
    <<: *base-backend
    container_name: fastapi-yt-taskiq-scheduler-dev
    command: taskiq scheduler app.infrastructure.taskiq.setup:scheduler
    depends_on:
      redis:
        condition: service_healthy

volumes:
  backend_venv:
    name: fastapi_yt_backend_venv
